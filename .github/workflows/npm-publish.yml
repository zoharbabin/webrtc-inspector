name: Publish to npm

# Runs on the same v<version> tag push as release.yml and chrome-publish.yml.
# Inert until the NPM_TOKEN repo secret exists — an npm "Automation" access
# token (https://www.npmjs.com/settings/<user>/tokens), scoped to publish.
# workflow_dispatch lets a missed release be republished by hand against its
# existing tag, without needing to re-push the tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check npm credentials are configured
        id: creds
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN not set — skipping npm publish for this tag."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        if: steps.creds.outputs.configured == 'true'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - run: npm ci
        if: steps.creds.outputs.configured == 'true'

      - name: Skip if this version is already published
        if: steps.creds.outputs.configured == 'true'
        id: check
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view @zoharbabin/webrtc-inspector@"$PKG_VERSION" version 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "::notice::$PKG_VERSION is already on npm — skipping publish."
            echo "shouldPublish=false" >> "$GITHUB_OUTPUT"
          else
            echo "shouldPublish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        if: steps.creds.outputs.configured == 'true' && steps.check.outputs.shouldPublish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
