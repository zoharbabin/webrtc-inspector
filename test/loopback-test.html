<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>webrtc-inspector loopback self-test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Minimal in-memory WebSocket stand-in installed BEFORE webrtc-inspector.js loads,
// so the core module wraps this instead of a real network socket. Lets the
// WebSocket-patch code path be exercised with zero real sockets and zero network
// calls, the same "no signaling server needed" principle the RTCPeerConnection
// test above already uses (direct SDP exchange in one page instead of a live network).
class MockWebSocket extends EventTarget {
  constructor(url, protocols) {
    super();
    this.url = url;
    this.protocol = Array.isArray(protocols) ? (protocols[0] || '') : (protocols || '');
    this.readyState = 0;
    this.sent = [];
    setTimeout(() => { this.readyState = 1; this.dispatchEvent(new Event('open')); }, 10);
  }
  send(data) { this.sent.push(data); }
  close(code, reason) {
    this.readyState = 3;
    this.dispatchEvent(new CloseEvent('close', { code: code || 1000, reason: reason || '', wasClean: true }));
  }
}
MockWebSocket.CONNECTING = 0; MockWebSocket.OPEN = 1; MockWebSocket.CLOSING = 2; MockWebSocket.CLOSED = 3;
window.WebSocket = MockWebSocket;
</script>
<script src="../core/webrtc-inspector.js"></script>
<script>
// Self-contained correctness check for webrtc-inspector.js: two RTCPeerConnections
// in one page, connected directly (no signaling server needed since both sides
// are reachable in the same JS context), exercising every patched code path.
// Run via Playwright/browser_evaluate against getSnapshot() — no network calls,
// no vendor conversation minutes spent. Writes PASS/FAIL lines into #out and
// window.__testResult so an automated check can read the outcome.

const SILENT_WAV_BASE64 = 'UklGRsQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';

async function run() {
  const results = [];
  const assert = (name, cond) => results.push(`${cond ? 'PASS' : 'FAIL'}: ${name}`);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  const inspector = window.__webrtcInspector;
  assert('inspector installed', !!inspector && !inspector.unsupported);

  const pcA = new RTCPeerConnection({ iceServers: [] });
  const pcB = new RTCPeerConnection({ iceServers: [] });
  pcA.onicecandidate = (e) => { if (e.candidate) pcB.addIceCandidate(e.candidate); };
  pcB.onicecandidate = (e) => { if (e.candidate) pcA.addIceCandidate(e.candidate); };

  const dcA = pcA.createDataChannel('test-channel');
  const dcBReady = new Promise((resolve) => { pcB.ondatachannel = (e) => resolve(e.channel); });

  // Fake-mic track fed straight into pcA via addTrack, correlated via getUserMedia patch.
  await inspector.setFakeMic(SILENT_WAV_BASE64);
  const fakeAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  fakeAudioStream.getTracks().forEach((t) => pcA.addTrack(t, fakeAudioStream));

  const offer = await pcA.createOffer();
  await pcA.setLocalDescription(offer);
  await pcB.setRemoteDescription(offer);
  const answer = await pcB.createAnswer();
  await pcB.setLocalDescription(answer);
  await pcA.setRemoteDescription(answer);

  const dcB = await dcBReady;
  await new Promise((resolve) => {
    if (dcA.readyState === 'open') return resolve();
    dcA.onopen = resolve;
  });

  const dcAMessages = [];
  const dcBMessages = [];
  dcA.addEventListener('message', (e) => dcAMessages.push(e.data));
  dcB.addEventListener('message', (e) => dcBMessages.push(e.data));
  const waitFor = async (arr, n, timeoutMs = 2000) => {
    const start = Date.now();
    while (arr.length < n && Date.now() - start < timeoutMs) await wait(20);
    return arr.length >= n;
  };

  dcA.send('hello from A');
  assert('data channel message delivered', await waitFor(dcBMessages, 1) && dcBMessages[0] === 'hello from A');

  // injectDataChannelMessage(2, ...) sends FROM connection 2's (B's) channel, so it
  // should arrive at A, not B — this is the send-side injection API, not a delivery-to-B API.
  inspector.injectDataChannelMessage(2, 'test-channel', 'injected via inspector API');
  assert('injectDataChannelMessage sends from the target connection\'s channel to its peer', await waitFor(dcAMessages, 1) && dcAMessages[0] === 'injected via inspector API');

  inspector.playIntoFakeMic(); // exercise the audio pipeline again so the level meter has signal to sample
  await wait(400); // let ICE finish gathering + let the level-meter interval (250ms) sample at least once

  // addTransceiver + fake camera: exercised on pcA independently of the already-negotiated
  // audio-only session above — we only assert on instrumentation, not on end-to-end delivery.
  await inspector.setFakeCam({ width: 64, height: 48 });
  const fakeVideoStream = await navigator.mediaDevices.getUserMedia({ video: true });
  pcA.addTransceiver(fakeVideoStream.getVideoTracks()[0], { direction: 'sendonly' });

  // Track lifecycle: stop the local fake-mic track directly and confirm our listener sees it.
  fakeAudioStream.getAudioTracks()[0].stop();
  await wait(50);

  const snap = inspector.getSnapshot();
  assert('two connections tracked', snap.connections.length === 2);
  const recA = snap.connections.find((c) => c.id === 1);
  const recB = snap.connections.find((c) => c.id === 2);
  assert('connection A has local fake-mic track tagged', !!recA && recA.localTracks.some((t) => t.sourceTag === 'fake-mic'));
  assert('connection B recorded remote data channel', !!recB && recB.dataChannels.some((d) => d.origin === 'remote' && d.label === 'test-channel'));
  assert('outbound message logged on A', !!recA && recA.dataChannels[0].messageCount >= 1);
  assert('fakeMicActive reflected in snapshot', snap.fakeMicActive === true);
  assert('fakeCamActive reflected in snapshot', snap.fakeCamActive === true);
  assert('addTransceiver logged a fake-cam local video track', !!recA && recA.localTracks.some((t) => t.kind === 'video' && t.sourceTag === 'fake-cam'));
  assert('local SDP summary captured (m-lines + codecs)', !!recA && recA.localSdpSummary && recA.localSdpSummary.mLines >= 1 && recA.localSdpSummary.codecs.length > 0);
  assert('remote SDP summary captured on B', !!recB && recB.remoteSdpSummary && recB.remoteSdpSummary.mLines >= 1);
  assert('local ICE candidates captured on A', !!recA && recA.localCandidateTypes.length > 0);
  assert('remote ICE candidates captured on B', !!recB && recB.remoteCandidateTypes.length > 0);
  assert('stopped local track reflected as ended', !!recA && recA.localTracks.find((t) => t.sourceTag === 'fake-mic').status === 'ended');
  assert('remote audio level metered (non-null number)', !!recB && typeof recB.remoteTracks.find((t) => t.kind === 'audio').level === 'number');

  // Data-channel interceptor: rewrite in flight, then block in flight.
  inspector.setDataChannelInterceptor((dir, ctx) => (dir === 'out' && ctx.label === 'test-channel' && ctx.data === 'rewrite me') ? ctx.data.toUpperCase() : undefined);
  dcA.send('rewrite me');
  await waitFor(dcBMessages, 2);
  assert('interceptor rewrote outgoing message in flight', dcBMessages[1] === 'REWRITE ME');

  const countBeforeBlock = dcBMessages.length;
  inspector.setDataChannelInterceptor((dir, ctx) => (dir === 'out' && ctx.data === 'block-this') ? false : undefined);
  dcA.send('block-this');
  await wait(300);
  assert('interceptor blocked outgoing message in flight', dcBMessages.length === countBeforeBlock);
  inspector.clearDataChannelInterceptor();

  const sdp = inspector.getSdp(1);
  assert('getSdp returns full local/remote SDP strings', !!sdp.local && typeof sdp.local.sdp === 'string' && sdp.local.sdp.length > 0);

  const remoteStream = inspector.getRemoteTrackStream(2, recB.remoteTracks.find((t) => t.kind === 'audio').trackId);
  assert('getRemoteTrackStream returns a live MediaStream', remoteStream instanceof MediaStream && remoteStream.getTracks().length === 1);

  // WebSocket instrumentation: construction/open tracking, send/receive capture,
  // in-flight interceptor rewrite/block in both directions, and synthetic-inbound injection.
  const ws = new WebSocket('wss://mock.test/app-message', 'proto-x');
  await wait(30); // let MockWebSocket's simulated open fire
  const wsMessages = [];
  ws.addEventListener('message', (e) => wsMessages.push(e.data));

  assert('WebSocket tracked in snapshot on creation', inspector.getSnapshot().webSockets.some((s) => s.url === 'wss://mock.test/app-message'));
  const wsId = inspector.getSnapshot().webSockets.find((s) => s.url === 'wss://mock.test/app-message').id;
  assert('WebSocket state reflects open', inspector.getSnapshot().webSockets.find((s) => s.id === wsId).state === 'open');

  ws.send('plain-out');
  assert('outgoing WebSocket message reaches the real send()', ws.sent.includes('plain-out'));
  assert('outgoing WebSocket message counted in snapshot', inspector.getSnapshot().webSockets.find((s) => s.id === wsId).sentCount === 1);

  inspector.injectWebSocketMessage(wsId, 'synthetic-in');
  assert('injectWebSocketMessage delivers a synthetic incoming message', await waitFor(wsMessages, 1) && wsMessages[0] === 'synthetic-in');
  assert('incoming WebSocket message counted in snapshot', inspector.getSnapshot().webSockets.find((s) => s.id === wsId).receivedCount === 1);

  inspector.setWebSocketInterceptor((dir, ctx) => {
    if (dir === 'out' && ctx.data === 'rewrite-out') return ctx.data.toUpperCase();
    if (dir === 'in' && ctx.data === 'rewrite-in') return ctx.data.toUpperCase();
    if (ctx.data === 'block-me') return false;
    return undefined;
  });
  assert('webSocketInterceptorActive reflected in snapshot', inspector.getSnapshot().webSocketInterceptorActive === true);

  ws.send('rewrite-out');
  assert('interceptor rewrote outgoing WebSocket message in flight', ws.sent[ws.sent.length - 1] === 'REWRITE-OUT');

  inspector.injectWebSocketMessage(wsId, 'rewrite-in');
  assert('interceptor rewrote incoming WebSocket message in flight', await waitFor(wsMessages, 2) && wsMessages[1] === 'REWRITE-IN');

  const sentCountBeforeBlock = ws.sent.length;
  ws.send('block-me');
  assert('interceptor blocked outgoing WebSocket message in flight', ws.sent.length === sentCountBeforeBlock);

  const receivedCountBeforeBlock = wsMessages.length;
  inspector.injectWebSocketMessage(wsId, 'block-me');
  await wait(50);
  assert('interceptor blocked incoming WebSocket message in flight', wsMessages.length === receivedCountBeforeBlock);

  inspector.clearWebSocketInterceptor();
  assert('webSocketInterceptorActive cleared in snapshot', inspector.getSnapshot().webSocketInterceptorActive === false);

  const log = document.getElementById('out');
  log.textContent = results.join('\n');
  window.__testResult = { pass: results.every((r) => r.startsWith('PASS')), results };
}

run().catch((err) => {
  document.getElementById('out').textContent = 'FAIL: uncaught error — ' + err.stack;
  window.__testResult = { pass: false, results: ['FAIL: uncaught error — ' + err.message] };
});
</script>
</body>
</html>
